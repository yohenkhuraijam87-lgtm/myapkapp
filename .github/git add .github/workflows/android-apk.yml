name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - uses: actions/checkout@v4

      # FORCE NODE 22 (CRITICAL - FIRST STEP)
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # HARD VERIFY NODE VERSION
      - name: Verify Node Version
        run: |
          node -v
          npm -v

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Install Capacitor CLI globally (IMPORTANT FIX)
      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      # Install Capacitor core
      - name: Install Capacitor Core
        run: npm install @capacitor/core

      # Sync AFTER CLI is ready
      - name: Capacitor Sync Android
        run: |
          export NODE_ENV=production
          npx cap sync android

      # Java setup
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Build APK
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kindle-pro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
