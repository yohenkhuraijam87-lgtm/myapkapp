name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node 22 (REQUIRED for Capacitor)
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Verify Node version
      - name: Check Node Version
        run: node -v

      # 4. Install dependencies
      - name: Install dependencies
        run: npm install

      # 5. Install Capacitor CLI globally
      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      # 6. Install Capacitor core
      - name: Install Capacitor Core
        run: npm install @capacitor/core

      # 7. Sync Capacitor Android
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 8. Setup Java 21 (FIX FOR GRADLE ERROR)
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 9. Build APK
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 10. Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kindle-pro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
