name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Node 22 (REQUIRED for Capacitor)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli @capacitor/core

      # Install Java 17 (stable for Android)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Install Android SDK automatically
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Build web assets (your app is static)
      - name: Build web
        run: echo "Static app - skipping build"

      # Capacitor sync (IMPORTANT)
      - name: Sync Capacitor
        run: npx cap sync android

      # Build APK
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kindle-pro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
