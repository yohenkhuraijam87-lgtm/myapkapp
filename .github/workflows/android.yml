name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4

      # 2. Setup Node (Capacitor requires Node 22+)
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Install dependencies
      - run: npm install

      # 4. Install Capacitor CLI
      - run: npm install -g @capacitor/cli

      # 5. Build web app (safe fallback if no build script)
      - run: npm run build || true

      # 6. Sync Capacitor Android project
      - run: npx cap sync android

      # 7. Setup Java for Android build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 8. Build APK
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 9. Upload APK (FIXED - reliable path)
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/**/*.apk
